name: Discord Notification

on:
  push:
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Push Notification
        if: github.event_name == 'push'
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          FIRST_LINE=$(echo "$MESSAGE" | head -n 1)
          jq -n \
            --arg title "🚀 New Push di ${{ github.repository }}" \
            --arg url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg msg "$FIRST_LINE" \
            --arg author "${{ github.event.head_commit.author.username }}" \
            --arg committer "${{ github.event.head_commit.committer.name }}" \
            --arg pushed "${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg avatar "https://github.com/${{ github.event.head_commit.author.username }}.png" \
            --arg time "${{ github.event.head_commit.timestamp }}" \
            '{embeds:[{title:$title,url:$url,color:5763719,
              thumbnail:{url:$avatar},
              fields:[
                {name:"📝 Pesan Commit",value:$msg,inline:false},
                {name:"👤 Author",value:$author,inline:true},
                {name:"🧑‍💻 Committer",value:$committer,inline:true},
                {name:"📤 Pushed by",value:$pushed,inline:true},
                {name:"🌿 Branch",value:$branch,inline:true}],
              timestamp:$time}]}' | \
            curl -H "Content-Type: application/json" -d @- "$WEBHOOK"

      - name: Pull Request Notification
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGED: ${{ github.event.pull_request.merged }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          FIRST_LINE=$(echo "$PR_TITLE" | head -n 1)
          if [ "$MERGED" = "true" ]; then
            STATUS="✅ Merged"
            COLOR=3066993
          else
            STATUS="❌ Closed"
            COLOR=15158332
          fi
          jq -n \
            --arg title "$STATUS PR di ${{ github.repository }}" \
            --arg url "${{ github.event.pull_request.html_url }}" \
            --arg msg "$FIRST_LINE" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg branch "${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}" \
            --arg avatar "https://github.com/${{ github.event.pull_request.user.login }}.png" \
            --arg time "${{ github.event.pull_request.updated_at }}" \
            --argjson color $COLOR \
            '{embeds:[{title:$title,url:$url,color:$color,
              thumbnail:{url:$avatar},
              fields:[
                {name:"📝 Judul PR",value:$msg,inline:false},
                {name:"👤 Author",value:$author,inline:true},
                {name:"🌿 Branch",value:$branch,inline:true}],
              timestamp:$time}]}' | \
            curl -H "Content-Type: application/json" -d @- "$WEBHOOK"
